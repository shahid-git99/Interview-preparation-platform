<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Feedback — PrepIQ</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .fb-wrap { padding:90px 5vw 4rem; max-width:900px; margin:0 auto; }

    /* Score hero */
    .score-hero {
      background: linear-gradient(135deg,#1a2d5a,#162236);
      border:1px solid rgba(67,97,238,0.3); border-radius:var(--radius-lg);
      padding:3rem; display:flex; align-items:center; gap:2.5rem;
      margin-bottom:2rem; position:relative; overflow:hidden;
    }
    .score-ring {
      flex-shrink:0; width:130px; height:130px; position:relative;
    }
    .score-ring svg { transform:rotate(-90deg); }
    .score-ring .score-num {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      font-family:var(--font-display); font-size:2.2rem; font-weight:800;
    }
    .score-info h2 {
      font-family:var(--font-display); font-size:clamp(1.4rem,3vw,2rem);
      font-weight:800; letter-spacing:-.5px; margin-bottom:.4rem;
    }
    .score-info p { color:var(--slate2); font-size:.95rem; line-height:1.65; max-width:480px; }
    .score-meta { display:flex; gap:1rem; flex-wrap:wrap; margin-top:1rem; }
    .sm-chip {
      display:flex; align-items:center; gap:.4rem;
      font-size:.8rem; color:var(--slate2);
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
      border-radius:50px; padding:.3rem .8rem;
    }

    /* Category scores */
    .cat-grid {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:1rem; margin-bottom:2rem;
    }
    .cat-card {
      background:var(--card); border:1px solid rgba(255,255,255,0.07);
      border-radius:var(--radius); padding:1.25rem;
    }
    .cat-card h4 { font-size:.8rem; color:var(--slate); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.75rem; }
    .cat-score { font-family:var(--font-display); font-size:1.6rem; font-weight:800; margin-bottom:.4rem; }
    .cat-bar-wrap { background:rgba(255,255,255,0.08); border-radius:50px; height:5px; }
    .cat-bar { height:5px; border-radius:50px; transition:width .6s ease; }

    /* Q breakdown */
    .q-review { display:flex; flex-direction:column; gap:1rem; margin-bottom:2rem; }
    .qr-item {
      background:var(--card); border:1px solid rgba(255,255,255,0.07);
      border-radius:var(--radius); overflow:hidden;
    }
    .qr-head {
      display:flex; align-items:center; gap:1rem; padding:1rem 1.25rem;
      cursor:pointer;
    }
    .qr-score {
      width:40px; height:40px; border-radius:var(--radius-sm);
      display:flex; align-items:center; justify-content:center;
      font-family:var(--font-display); font-size:.9rem; font-weight:800;
      flex-shrink:0;
    }
    .qr-info { flex:1; }
    .qr-info .qr-q { font-size:.88rem; font-weight:600; line-height:1.4; }
    .qr-info .qr-type { font-size:.75rem; color:var(--slate); margin-top:.15rem; }
    .qr-chevron { color:var(--slate); font-size:.85rem; transition:transform .2s; }
    .qr-item.open .qr-chevron { transform:rotate(180deg); }

    .qr-body { display:none; padding:0 1.25rem 1.25rem; border-top:1px solid rgba(255,255,255,0.06); }
    .qr-item.open .qr-body { display:block; }
    .qr-section { margin-top:1rem; }
    .qr-section h5 { font-size:.75rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--slate); margin-bottom:.5rem; }
    .qr-section p { font-size:.88rem; color:var(--slate2); line-height:1.65; }

    /* Strengths / improvements */
    .sw-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; margin-bottom:2rem; }
    .sw-card { background:var(--card); border-radius:var(--radius); padding:1.5rem; }
    .sw-card h3 { font-family:var(--font-display); font-size:1rem; font-weight:700; margin-bottom:1rem; }
    .sw-list { list-style:none; display:flex; flex-direction:column; gap:.6rem; }
    .sw-list li { font-size:.88rem; color:var(--slate2); display:flex; gap:.6rem; align-items:flex-start; line-height:1.55; }
    .sw-list li .bullet { flex-shrink:0; margin-top:.1rem; }

    .actions-row { display:flex; gap:1rem; flex-wrap:wrap; }
    .loading-state { text-align:center; padding:5rem 2rem; color:var(--slate2); }
    .loading-state .spinner { width:48px; height:48px; border-width:4px; margin:0 auto 1.5rem; }
    .loading-state p { font-size:1rem; }

    @media(max-width:700px) {
      .score-hero { flex-direction:column; text-align:center; }
      .sw-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">Prep<span>IQ</span></a>
  <div class="nav-links">
    <a href="dashboard.html" class="btn btn-outline btn-sm">← Dashboard</a>
  </div>
</nav>

<div class="fb-wrap">

  <!-- Loading state -->
  <div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    <p>Analysing your responses…<br>
       <span style="font-size:.85rem;color:var(--slate);">Gemini is reading your answers and generating your report.</span>
    </p>
  </div>

  <!-- Content (hidden until loaded) -->
  <div id="fbContent" style="display:none;">

    <!-- Score hero -->
    <div class="score-hero">
      <div class="orb orb-indigo" style="width:300px;height:300px;top:-80px;right:-60px;"></div>
      <div class="score-ring">
        <svg viewBox="0 0 120 120" width="130" height="130">
          <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
          <circle cx="60" cy="60" r="50" fill="none" stroke="var(--mint)" stroke-width="10"
            stroke-dasharray="314.16" stroke-dashoffset="314.16"
            id="scoreArc" stroke-linecap="round"/>
        </svg>
        <div class="score-num" id="scorePct">—</div>
      </div>
      <div class="score-info">
        <h2 id="scoreTitle">Calculating your score…</h2>
        <p id="scoreSummary">—</p>
        <div class="score-meta" id="scoreMeta"></div>
      </div>
    </div>

    <!-- Category breakdown -->
    <div class="cat-grid" id="catGrid"></div>

    <!-- Q-by-Q review -->
    <div style="margin-bottom:1.25rem;">
      <h3 style="font-family:var(--font-display);font-size:1.1rem;font-weight:700;">Question-by-question breakdown</h3>
    </div>
    <div class="q-review" id="qReview"></div>

    <!-- Strengths & improvements -->
    <div class="sw-grid" id="swGrid"></div>

    <!-- Next steps -->
    <div class="actions-row">
      <a href="interview.html" class="btn btn-mint btn-lg">🔄 Retake Interview</a>
      <a href="dashboard.html" class="btn btn-outline btn-lg">← Dashboard</a>
    </div>

  </div>
</div>

<script>
  const API = 'http://localhost:8000';
  const token = localStorage.getItem('prepiq_token');
  if (!token) window.location.href = 'login.html';

  function scoreColor(s) {
    if (s >= 80) return 'var(--mint)';
    if (s >= 60) return 'var(--warn)';
    return 'var(--error)';
  }
  function scoreLabel(s) {
    if (s >= 85) return '🌟 Outstanding';
    if (s >= 70) return '✅ Strong Performance';
    if (s >= 55) return '🔶 Good Effort';
    if (s >= 40) return '💡 Room to Grow';
    return '📚 Keep Practising';
  }

  async function loadFeedback() {
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session');
    if (!sessionId) { window.location.href = 'dashboard.html'; return; }

    try {
      const res = await fetch(`${API}/interview/feedback/${sessionId}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Failed to load feedback.');
      renderFeedback(data);
    } catch (e) {
      document.getElementById('loadingState').innerHTML =
        `<p style="color:var(--error)">Failed to load feedback: ${e.message}</p>
         <a href="dashboard.html" class="btn btn-outline" style="margin-top:1rem;">← Dashboard</a>`;
    }
  }

  function renderFeedback(data) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('fbContent').style.display = 'block';

    const score = data.overall_score ?? 0;

    // Score ring animation
    const arc = document.getElementById('scoreArc');
    const circumference = 314.16;
    setTimeout(() => {
      arc.style.strokeDashoffset = circumference - (score / 100) * circumference;
      arc.style.transition = 'stroke-dashoffset 1.2s ease';
      arc.style.stroke = scoreColor(score);
    }, 100);

    document.getElementById('scorePct').textContent = score + '%';
    document.getElementById('scoreTitle').textContent = scoreLabel(score);
    document.getElementById('scoreSummary').textContent = data.summary || '—';

    const duration = data.duration_seconds ? `${Math.round(data.duration_seconds/60)} min` : '—';
    document.getElementById('scoreMeta').innerHTML = `
      <span class="sm-chip">❓ ${data.question_count || '?'} questions</span>
      <span class="sm-chip">⏱️ ${duration}</span>
      <span class="sm-chip">🎯 ${data.domain || '—'}</span>
      <span class="sm-chip">📅 ${new Date(data.completed_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span>
    `;

    // Category scores
    const cats = data.category_scores || {};
    const catGrid = document.getElementById('catGrid');
    catGrid.innerHTML = Object.entries(cats).map(([name, val]) => `
      <div class="cat-card">
        <h4>${name}</h4>
        <div class="cat-score" style="color:${scoreColor(val)}">${val}%</div>
        <div class="cat-bar-wrap">
          <div class="cat-bar" style="width:${val}%;background:${scoreColor(val)}"></div>
        </div>
      </div>`).join('');

    // Q review
    const qReview = document.getElementById('qReview');
    qReview.innerHTML = (data.answers || []).map((a, i) => {
      const s = a.score ?? 0;
      const bg = s >= 70 ? 'rgba(6,214,160,0.12)' : s >= 50 ? 'rgba(255,209,102,0.1)' : 'rgba(239,71,111,0.1)';
      return `
      <div class="qr-item" id="qri-${i}">
        <div class="qr-head" onclick="toggleQR(${i})">
          <div class="qr-score" style="background:${bg};color:${scoreColor(s)}">${a.skipped ? '—' : s+'%'}</div>
          <div class="qr-info">
            <div class="qr-q">${a.question}</div>
            <div class="qr-type">${a.type || 'General'} ${a.skipped ? '· Skipped' : ''}</div>
          </div>
          <div class="qr-chevron">▼</div>
        </div>
        <div class="qr-body">
          ${a.skipped ? '<p style="color:var(--warn);font-size:.88rem;padding-top:.5rem;">This question was skipped.</p>' : `
          <div class="qr-section">
            <h5>Your Answer</h5>
            <p>${a.user_answer || '(no answer provided)'}</p>
          </div>
          <div class="qr-section">
            <h5>AI Feedback</h5>
            <p>${a.feedback || '—'}</p>
          </div>
          <div class="qr-section">
            <h5>What a great answer would include</h5>
            <p>${a.ideal_points || '—'}</p>
          </div>`}
        </div>
      </div>`;
    }).join('');

    // Strengths & improvements
    const strengths    = data.strengths    || [];
    const improvements = data.improvements || [];
    document.getElementById('swGrid').innerHTML = `
      <div class="sw-card" style="border:1px solid rgba(6,214,160,0.2)">
        <h3 style="color:var(--mint)">✅ Strengths</h3>
        <ul class="sw-list">
          ${strengths.map(s => `<li><span class="bullet">✓</span>${s}</li>`).join('') || '<li><span class="bullet">—</span>Complete the interview to see strengths.</li>'}
        </ul>
      </div>
      <div class="sw-card" style="border:1px solid rgba(255,209,102,0.2)">
        <h3 style="color:var(--warn)">📈 Areas to Improve</h3>
        <ul class="sw-list">
          ${improvements.map(s => `<li><span class="bullet">→</span>${s}</li>`).join('') || '<li><span class="bullet">—</span>No major issues found.</li>'}
        </ul>
      </div>`;
  }

  function toggleQR(i) {
    const el = document.getElementById(`qri-${i}`);
    el.classList.toggle('open');
  }

  loadFeedback();
</script>
</body>
</html>
